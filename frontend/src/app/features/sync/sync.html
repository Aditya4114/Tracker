<div class="sync-widget">
  <div class="sync-controls">
    <div class="date-range">
      <input type="date" class="input-field date-input" [(ngModel)]="startDate" (ngModelChange)="onDateChange()" [min]="minDate" [max]="endDate" title="Start Date">
      <span class="to">to</span>
      <input type="date" class="input-field date-input" [(ngModel)]="endDate" (ngModelChange)="onDateChange()" [min]="startDate" [max]="maxDate" title="End Date">
    </div>
    
    <button class="btn-primary sync-btn" (click)="triggerSync()" [disabled]="syncing">
      <svg *ngIf="syncing" class="spinner" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" stroke-dasharray="32" stroke-dashoffset="0"></circle>
      </svg>
      <svg *ngIf="!syncing" class="sync-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
      {{ syncing ? 'Syncing...' : 'Sync Now' }}
    </button>
  </div>
  <div *ngIf="statusMessage" class="status-message fade-in" [class.error]="isError">
    {{ statusMessage }}
  </div>
</div>
