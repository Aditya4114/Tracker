<div class="auth-wrapper fade-in">
  <div class="glass-panel auth-card">
    <div class="auth-header">
      <h2>Create Account</h2>
      <p>Start tracking your applications today</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label class="label" for="username">Username</label>
        <input type="text" id="username" class="input-field" [(ngModel)]="username" name="username" required placeholder="Choose a username">
      </div>
      
      <div class="form-group">
        <label class="label" for="email">Email</label>
        <input type="email" id="email" class="input-field" [(ngModel)]="email" name="email" required placeholder="Enter your email">
      </div>
      
      <div class="form-group">
        <label class="label" for="password">Password</label>
        <input type="password" id="password" class="input-field" [(ngModel)]="password" name="password" required placeholder="Create a password">
      </div>

      <div class="consent-group">
        <label class="checkbox-label">
          <input type="checkbox" [(ngModel)]="agreeConsent" name="agreeConsent" required>
          <span>
            I agree to the <a routerLink="/terms" target="_blank">Terms of Service</a> and 
            <a routerLink="/privacy" target="_blank">Privacy Policy</a>, and consent to Job Tracker searching and extracting job application updates from my Gmail inbox and analyzing truncated text with AI.
          </span>
        </label>
      </div>

      <button type="submit" class="btn-primary w-full mt-4" [disabled]="loading || !agreeConsent">
        {{ loading ? 'Creating...' : 'Sign Up' }}
      </button>
    </form>

    <div class="divider">
      <span>OR</span>
    </div>

    <p class="google-disclaimer">
      By continuing with Google, you consent to our <a routerLink="/terms" target="_blank">Terms</a>, 
      <a routerLink="/privacy" target="_blank">Privacy Policy</a>, and 
      <a routerLink="/google-limited-use" target="_blank">Google Limited Use</a> terms.
    </p>

    <button class="btn-secondary w-full google-btn" (click)="signUpWithGoogle()">
      <svg class="google-icon" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Sign up with Google
    </button>
    
    <div class="auth-footer">
      <p>Already have an account? <a routerLink="/login">Sign in</a></p>
    </div>
  </div>
</div>
