server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: gateway

auth:
  service:
    uri: ${AUTH_SERVICE_URI:http://127.0.0.1:8081}

ingestion:
  service:
    uri: ${INGESTION_SERVICE_URI:http://127.0.0.1:8082}

intelligence:
  service:
    uri: ${INTELLIGENCE_SERVICE_URI:http://127.0.0.1:8083}

core:
  service:
    uri: ${CORE_SERVICE_URI:http://127.0.0.1:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Core Service
        url: /api/applications/v3/api-docs
      - name: Auth Service
        url: /api/auth/v3/api-docs
      - name: Ingestion Service
        url: /api/sync/v3/api-docs
      - name: Intelligence Service
        url: /api/classification/v3/api-docs

