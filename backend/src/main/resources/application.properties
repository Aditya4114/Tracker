spring.application.name=backend
server.port=8080

# PostgreSQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jobtracker}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:tracker_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:tracker_password}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Native Spring Boot .env loading
spring.config.import=optional:file:.env[.properties]

# Security & Tokens
jwt.secret=${JWT_SECRET:defaultSecretKeyThatIsAtLeast32BytesLongForHS256}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
encryption.secret=${ENCRYPTION_SECRET:default16bytekey}

# Google OAuth (Placeholders)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:placeholder_client_id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:placeholder_client_secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email,https://www.googleapis.com/auth/gmail.readonly

# Gemini API placeholder
gemini.api.key=${GEMINI_API_KEY:placeholder_api_key}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent
