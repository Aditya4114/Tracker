server:
  port: 8082

spring:
  application:
    name: ingestion-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:jobtracker}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:${DB_PASSWORD:}}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    template:
      observation-enabled: true

auth:
  service:
    url: ${AUTH_SERVICE_URL:http://localhost:8081}

intelligence:
  service:
    url: ${INTELLIGENCE_SERVICE_URL:http://localhost:8083}

internal:
  secret: ${INTERNAL_SECRET:super-secret-internal-key}

jwt:
  secret: ${JWT_SECRET:your_super_secret_jwt_key_that_is_at_least_256_bits_long}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

springdoc:
  api-docs:
    path: /api/sync/v3/api-docs

