apiVersion: apps/v1
kind: Deployment
metadata:
  name: intelligence-service
  namespace: jobtracker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: intelligence-service
  template:
    metadata:
      labels:
        app: intelligence-service
    spec:
      containers:
        - name: intelligence-service
          image: tracker/intelligence-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          env:
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: jobtracker-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: jobtracker-config
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              value: tracker_intelligence
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: jobtracker-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jobtracker-secrets
                  key: POSTGRES_PASSWORD
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: jobtracker-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: jobtracker-secrets
                  key: GEMINI_API_KEY
          resources:
            requests:
              cpu: 300m
              memory: 768Mi
            limits:
              cpu: 1500m
              memory: 1536Mi
          readinessProbe:
            tcpSocket:
              port: 8083
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: intelligence-service
  namespace: jobtracker
spec:
  selector:
    app: intelligence-service
  ports:
    - port: 8083
      targetPort: 8083
