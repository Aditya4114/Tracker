apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: jobtracker
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
  namespace: jobtracker
data:
  init-db.sql: |
    CREATE DATABASE tracker_auth;
    CREATE DATABASE tracker_ingestion;
    CREATE DATABASE tracker_intelligence;
    CREATE DATABASE tracker_core;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  namespace: jobtracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: jobtracker
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: jobtracker-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jobtracker-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: init-script
          configMap:
            name: postgres-init-script
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: jobtracker
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
