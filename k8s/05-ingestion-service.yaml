apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-service
  namespace: jobtracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ingestion-service
  template:
    metadata:
      labels:
        app: ingestion-service
    spec:
      containers:
        - name: ingestion-service
          image: tracker/ingestion-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: jobtracker-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: jobtracker-config
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              value: tracker_ingestion
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: jobtracker-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jobtracker-secrets
                  key: POSTGRES_PASSWORD
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: jobtracker-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: jobtracker-config
                  key: AUTH_SERVICE_URL
            - name: INTERNAL_SECRET
              valueFrom:
                configMapKeyRef:
                  name: jobtracker-config
                  key: INTERNAL_SECRET
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jobtracker-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          readinessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion-service
  namespace: jobtracker
spec:
  selector:
    app: ingestion-service
  ports:
    - port: 8082
      targetPort: 8082
